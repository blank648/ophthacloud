name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: academic/backend/pom.xml
      - name: Run unit tests
        working-directory: academic/backend
        run: ./mvnw -B test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles() requires a checked-out workspace, so evaluate after checkout
      - uses: actions/setup-node@v4
        if: hashFiles('academic/frontend/package.json') != ''
        with:
          node-version: '20'
      - name: Install and build frontend
        if: hashFiles('academic/frontend/package.json') != ''
        working-directory: academic/frontend
        run: npm ci && npm run build
