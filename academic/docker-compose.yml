services:
  postgres:
    image: postgres:16-alpine
    container_name: ophthacloud-academic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ophthacloud_academic}
      POSTGRES_USER: ${POSTGRES_USER:-ophthacloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ophthacloud_dev}
    ports:
      - "${ACADEMIC_DB_PORT:-5435}:5432"
    volumes:
      - ophthacloud_academic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ophthacloud} -d ${POSTGRES_DB:-ophthacloud_academic}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ophthacloud_academic_pgdata:
