<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frontend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="backend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="facade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="infra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="16" fill="url(#bg-grad)"/>

  <!-- Title Banner -->
  <text x="450" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
    OphthaCloud — System Architecture Diagram
  </text>
  <text x="450" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Spring Boot 4 + Spring Modulith • 12 DDD Contexts • React 18 • Multi-Tenant
  </text>

  <!-- 1. FRONTEND LAYER -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="820" height="75" rx="10" fill="url(#frontend-grad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">FRONTEND LAYER</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#bae6fd">React 18 SPA + TypeScript + Vite + Tailwind CSS / Tauri Desktop Client</text>
    
    <!-- Sub-components -->
    <rect x="520" y="16" width="130" height="42" rx="6" fill="#0284c7" stroke="#7dd3fc" stroke-width="1"/>
    <text x="585" y="42" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Keycloak OIDC</text>
    
    <rect x="665" y="16" width="135" height="42" rx="6" fill="#0284c7" stroke="#7dd3fc" stroke-width="1"/>
    <text x="732" y="42" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">React Query + Ax</text>
  </g>

  <!-- Arrow Down 1 -->
  <path d="M 450 160 L 450 185" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="460" y="177" font-family="sans-serif" font-size="11" fill="#38bdf8">REST API (JWT Bearer)</text>

  <!-- 2. BACKEND LAYER (Modular Monolith) -->
  <g transform="translate(40, 195)" filter="url(#shadow)">
    <rect width="820" height="270" rx="10" fill="url(#backend-grad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">MODULAR MONOLITH BACKEND (Spring Boot 4 + Spring Modulith)</text>
    
    <!-- Facades Grid (12 Modules) -->
    <text x="20" y="54" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">Bounded Context Facades & Public APIs</text>
    
    <!-- Row 1 Facades -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="60" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Patients</text>

      <rect x="130" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="190" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Appointments</text>

      <rect x="260" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="320" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">EMR (Consult)</text>

      <rect x="390" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="450" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Investigations</text>

      <rect x="520" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="580" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Prescriptions</text>

      <rect x="650" y="0" width="125" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="712" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Optical ERP</text>
    </g>

    <!-- Row 2 Facades -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="60" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Notifications</text>

      <rect x="130" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="190" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Patient Portal</text>

      <rect x="260" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="320" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Reports &amp; Analytics</text>

      <rect x="390" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="450" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Admin &amp; Config</text>

      <rect x="520" y="0" width="120" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="580" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Audit Logs</text>

      <rect x="650" y="0" width="125" height="35" rx="5" fill="url(#facade-grad)" stroke="#818cf8"/>
      <text x="712" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Dashboard</text>
    </g>

    <!-- Internal Core Services -->
    <rect x="20" y="160" width="775" height="90" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-dasharray="4,4"/>
    <text x="35" y="182" font-family="sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">Domain Logic &amp; Shared Infrastructure</text>

    <g transform="translate(35, 192)">
      <rect x="0" y="0" width="175" height="42" rx="5" fill="#312e81" stroke="#6366f1"/>
      <text x="87" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">TenantContext / Security</text>

      <rect x="190" y="0" width="185" height="42" rx="5" fill="#312e81" stroke="#6366f1"/>
      <text x="282" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">Event Publication Registry</text>

      <rect x="390" y="0" width="180" height="42" rx="5" fill="#312e81" stroke="#6366f1"/>
      <text x="480" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">ArchUnit Verification</text>

      <rect x="585" y="0" width="165" height="42" rx="5" fill="#312e81" stroke="#6366f1"/>
      <text x="667" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#e0e7ff" text-anchor="middle">iText PDF Engine</text>
    </g>
  </g>

  <!-- Arrow Down 2 -->
  <path d="M 450 465 L 450 485" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- 3. INFRASTRUCTURE LAYER -->
  <g transform="translate(40, 490)" filter="url(#shadow)">
    <rect width="820" height="100" rx="10" fill="url(#infra-grad)" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">INFRASTRUCTURE LAYER</text>

    <g transform="translate(20, 38)">
      <!-- PostgreSQL -->
      <rect x="0" y="0" width="185" height="48" rx="6" fill="#0f766e" stroke="#5eead4" stroke-width="1"/>
      <text x="92" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PostgreSQL 16</text>
      <text x="92" y="38" font-family="sans-serif" font-size="10" fill="#99f6e4" text-anchor="middle">Flyway V1–V34 • RLS Multi-Tenant</text>

      <!-- Keycloak -->
      <rect x="200" y="0" width="185" height="48" rx="6" fill="#0f766e" stroke="#5eead4" stroke-width="1"/>
      <text x="292" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Keycloak 26</text>
      <text x="292" y="38" font-family="sans-serif" font-size="10" fill="#99f6e4" text-anchor="middle">OIDC / OAuth2 / Custom Claims</text>

      <!-- Redis -->
      <rect x="400" y="0" width="185" height="48" rx="6" fill="#0f766e" stroke="#5eead4" stroke-width="1"/>
      <text x="492" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Redis 7</text>
      <text x="492" y="38" font-family="sans-serif" font-size="10" fill="#99f6e4" text-anchor="middle">Session Cache &amp; Rate Limiting</text>

      <!-- MinIO -->
      <rect x="600" y="0" width="175" height="48" rx="6" fill="#0f766e" stroke="#5eead4" stroke-width="1"/>
      <text x="687" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">MinIO S3</text>
      <text x="687" y="38" font-family="sans-serif" font-size="10" fill="#99f6e4" text-anchor="middle">Diagnostic Images &amp; PDFs</text>
    </g>
  </g>
</svg>
